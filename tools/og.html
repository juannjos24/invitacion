<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador de vistas previas (og:image)</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; background: #111; color: #eee; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0 0 14px; color: #bbb; max-width: 70ch; }
    code { background: #222; padding: 1px 5px; border-radius: 4px; }
    button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: #f5b800; color: #1a1206; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin-left: 12px; color: #bbb; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 20px; }
    figure { margin: 0; background: #1c1c1c; border-radius: 8px; overflow: hidden; }
    figure img { display: block; width: 100%; height: auto; }
    figcaption { padding: 6px 10px; font-size: 13px; display: flex; justify-content: space-between; }
    figcaption a { color: #f5b800; }
  </style>
</head>
<body>
  <h1>Vistas previas para WhatsApp (og:image)</h1>
  <p>Genera un recorte de 1200×630 del flyer con el nombre de cada invitado de <code>names.js</code>
     (más las genéricas <code>hombre</code> y <code>mujer</code>). Guarda cada archivo en
     <code>assets/og/&lt;slug&gt;.jpg</code> y luego corre <code>node tools/build-guests.js</code>.</p>
  <button id="run">Generar todas</button>
  <button id="download" disabled>Descargar todas</button>
  <span id="status"></span>
  <div class="grid" id="grid"></div>

  <script src="../assets/js/names.js"></script>
  <script src="../assets/js/flyer.js"></script>
  <script src="og.js"></script>
</body>
</html>
