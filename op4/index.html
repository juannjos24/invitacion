<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:type" content="website">
  <meta property="og:title" content="DIOS NO DESISTE · Vigilia Juvenil y de Oración">
  <meta property="og:description" content="De la oscuridad… a Su luz. Sábado 10 de octubre de 2026 · 17:00–23:00 · IASD Portales. Encuentra tu invitación.">
  <meta property="og:image" content="https://juannjos24.github.io/invitacion/assets/flyer.jpg">
  <meta property="og:url" content="https://juannjos24.github.io/invitacion/op4/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2746%27 fill=%27%23f5b800%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2752%27 text-anchor=%27middle%27 fill=%27%231a1206%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E%E2%9C%89%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;700&family=Montserrat:wght@400;600;800&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="hunting">
  <canvas id="particles" class="particles" aria-hidden="true"></canvas>
  <div class="rays" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar">
    <a class="back" href="../">← Opciones</a>
    <div id="sound-slot"></div>
  </header>

  <main class="stage" id="stage">
    <!-- El sobre se coloca en una posición aleatoria (ver app.js) -->
    <div class="envelope-wrap env-hidden" id="envelope-slot"></div>
    <div class="beacon" id="beacon" hidden aria-hidden="true"></div>

    <!-- Título que aparece cuando llega la luz -->
    <div class="lit-title" id="lit-title" aria-hidden="true">
      <p class="kicker">De la oscuridad…</p>
      <h1 class="title">a Su luz</h1>
    </div>
  </main>

  <!-- Palabras de la oscuridad (se difuminan cuando llega la luz) -->
  <div class="words" id="words" aria-hidden="true">
    <span style="--x:12%; --y:18%; --d:0s">Depresión</span>
    <span style="--x:58%; --y:30%; --d:-2s">tristeza</span>
    <span style="--x:20%; --y:62%; --d:-4s">soledad</span>
    <span style="--x:55%; --y:78%; --d:-6s">ansiedad…</span>
  </div>

  <!-- Oscuridad con la "linterna" -->
  <div class="dark-overlay" id="overlay" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <p class="hint hunt-hint" id="hint" aria-live="polite">Mueve la luz para encontrar el sobre</p>
  <button class="btn btn-ghost help" id="help" hidden>¿No lo encuentras? Dame una pista</button>

  <section class="reveal" id="reveal" hidden>
    <article id="letter" aria-live="polite"></article>
  </section>

  <script src="../assets/js/common.js"></script>
  <script src="app.js"></script>
</body>
</html>
